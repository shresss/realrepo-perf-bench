[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerly"
version = "2.3.1"
description = "Invoicing, customer statements, and the month-end export."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ledgerly-report = "ledgerly.report:main"

[tool.setuptools.packages.find]
include = ["ledgerly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
